# Deploy da API no Render (https://render.com) — plano gratuito.
# No painel do Render: New > Blueprint > selecione este repositório.
services:
  - type: web
    name: treino-certo-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: TZ               # datas no horário de Brasília
        value: America/Sao_Paulo
