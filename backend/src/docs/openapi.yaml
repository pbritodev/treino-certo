openapi: 3.0.3
info:
  title: TreinoCerto API
  version: 1.0.0
  description: |
    API REST do aplicativo **TreinoCerto**. Cadastra usuários, recebe as respostas
    do questionário de treino, gera um plano personalizado (motor de recomendação)
    com meta calórica, mantém um diário alimentar com contagem de calorias e o
    histórico de pesagens. Tudo é persistido em um banco relacional SQLite.
servers:
  - url: /
    description: Servidor atual
tags:
  - name: Autenticação
  - name: Usuários
  - name: Avaliações
  - name: Alimentação
  - name: Pesagens
  - name: Progresso
  - name: Sistema
paths:
  /api/health:
    get:
      tags: [Sistema]
      summary: Verifica se a API está no ar
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
  /api/usuarios:
    get:
      tags: [Usuários]
      summary: Lista todos os usuários
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Usuario' }
    post:
      tags: [Usuários]
      summary: Cadastra um usuário (cadastre-se)
      description: A senha é armazenada apenas como hash (scrypt + salt) e nunca é devolvida.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CadastroEntrada' }
      responses:
        '201':
          description: Usuário criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Invalido' }
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /api/usuarios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      summary: Busca um usuário pelo id
      responses:
        '200':
          description: Usuário encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Usuários]
      summary: Atualiza os dados de um usuário
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UsuarioEntrada' }
      responses:
        '200':
          description: Usuário atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: E-mail já cadastrado por outro usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
    delete:
      tags: [Usuários]
      summary: Remove um usuário (e suas avaliações)
      responses:
        '204': { description: Usuário removido }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/usuarios/{id}/avaliacoes:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Usuários]
      summary: Lista o histórico de avaliações de um usuário (mais recentes primeiro)
      responses:
        '200':
          description: Histórico de avaliações
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Avaliacao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/avaliacoes:
    post:
      tags: [Avaliações]
      summary: Envia as respostas do questionário e gera o plano de treino
      description: Calcula IMC, intensidade recomendada, perfil e plano semanal e salva a avaliação.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoEntrada' }
      responses:
        '201':
          description: Avaliação criada com o plano gerado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/avaliacoes/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Avaliações]
      summary: Busca uma avaliação pelo id
      responses:
        '200':
          description: Avaliação encontrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    patch:
      tags: [Avaliações]
      summary: Atualiza a observação e/ou o favorito de uma avaliação
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AvaliacaoAtualizacao' }
      responses:
        '200':
          description: Avaliação atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avaliacao' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Avaliações]
      summary: Remove uma avaliação
      responses:
        '204': { description: Avaliação removida }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/alimentos:
    get:
      tags: [Alimentação]
      summary: Lista alimentos (valores por 100 g/ml)
      description: Sem usuarioId, lista só os alimentos padrão; com usuarioId, inclui os alimentos que o usuário criou.
      parameters:
        - { name: busca, in: query, schema: { type: string }, description: Parte do nome, example: arroz }
        - { name: usuarioId, in: query, schema: { type: integer }, description: Inclui os alimentos criados por este usuário, example: 1 }
        - name: categoria
          in: query
          schema: { type: string, enum: [CEREAIS, PROTEINAS, LEGUMINOSAS, FRUTAS, LATICINIOS, VEGETAIS, GORDURAS, BEBIDAS, OUTROS] }
      responses:
        '200':
          description: Lista de alimentos
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alimento' }
    post:
      tags: [Alimentação]
      summary: Cria um alimento personalizado
      description: Valores nutricionais por 100 g (ou 100 ml). O alimento fica visível apenas para quem o criou.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlimentoEntrada' }
      responses:
        '201':
          description: Alimento criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alimento' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: Já existe um alimento com esse nome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /api/alimentos/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Alimentação]
      summary: Busca um alimento pelo id
      responses:
        '200':
          description: Alimento encontrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Alimento' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/usuarios/{id}/diario:
    parameters:
      - $ref: '#/components/parameters/Id'
      - { name: data, in: query, schema: { type: string, format: date }, description: 'AAAA-MM-DD (padrão: hoje)', example: '2026-11-16' }
    get:
      tags: [Alimentação]
      summary: Diário alimentar do dia com totais e meta calórica
      description: A meta vem da avaliação mais recente do usuário (ou 2000 kcal se não houver).
      responses:
        '200':
          description: Diário do dia
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Diario' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/registros-alimentares:
    post:
      tags: [Alimentação]
      summary: Adiciona um alimento consumido ao diário
      description: As calorias e macronutrientes são calculados pela quantidade ingerida (valor por 100 g × quantidade / 100).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroAlimentarEntrada' }
      responses:
        '201':
          description: Registro criado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroAlimentar' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/registros-alimentares/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Alimentação]
      summary: Altera a quantidade e/ou a refeição de um item do diário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantidade, refeicao]
              properties:
                quantidade: { type: number, example: 200 }
                refeicao: { type: string, enum: [CAFE_DA_MANHA, ALMOCO, LANCHE, JANTAR] }
      responses:
        '200':
          description: Registro atualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistroAlimentar' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Alimentação]
      summary: Remove um item do diário
      responses:
        '204': { description: Registro removido }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/usuarios/{id}/pesagens:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Pesagens]
      summary: Histórico de peso do usuário (ordem cronológica)
      responses:
        '200':
          description: Lista de pesagens
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Pesagem' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/pesagens:
    post:
      tags: [Pesagens]
      summary: Registra uma pesagem (uma por dia)
      description: Se já existir pesagem na mesma data, o peso é atualizado (200). Criar uma avaliação também registra o peso do dia.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PesagemEntrada' }
      responses:
        '200':
          description: Pesagem do dia atualizada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pesagem' }
        '201':
          description: Pesagem registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pesagem' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/pesagens/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Pesagens]
      summary: Remove uma pesagem
      responses:
        '204': { description: Pesagem removida }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/auth/login:
    post:
      tags: [Autenticação]
      summary: Login com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, senha]
              properties:
                email: { type: string, example: maria@email.com }
                senha: { type: string, example: '123456' }
      responses:
        '200':
          description: Login realizado; devolve o usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '400': { $ref: '#/components/responses/Invalido' }
        '401':
          description: E-mail ou senha incorretos
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /api/usuarios/{id}/senha:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Autenticação]
      summary: Troca a senha (exige a senha atual)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senhaAtual, novaSenha]
              properties:
                senhaAtual: { type: string, example: '123456' }
                novaSenha: { type: string, minLength: 6, example: novaSenha1 }
      responses:
        '204': { description: Senha alterada }
        '400': { $ref: '#/components/responses/Invalido' }
        '401':
          description: Senha atual incorreta
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/treinos-realizados:
    post:
      tags: [Progresso]
      summary: Registra um treino concluído
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TreinoRealizadoEntrada' }
      responses:
        '201':
          description: Treino registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TreinoRealizado' }
        '400': { $ref: '#/components/responses/Invalido' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409':
          description: Este dia do plano já foi registrado nesta data
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Erro' }
  /api/treinos-realizados/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [Progresso]
      summary: Remove um treino registrado
      responses:
        '204': { description: Treino removido }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/usuarios/{id}/treinos-realizados:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Progresso]
      summary: Lista os treinos concluídos (mais recentes primeiro)
      parameters:
        - { name: data, in: query, schema: { type: string, format: date }, description: Filtra por um dia (AAAA-MM-DD), example: '2026-11-16' }
      responses:
        '200':
          description: Treinos realizados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TreinoRealizado' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
  /api/usuarios/{id}/progresso:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Progresso]
      summary: Resumo do progresso (perfil, plano atual, peso e estatísticas de treino)
      responses:
        '200':
          description: Progresso do usuário
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Progresso' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, example: 1 }
  responses:
    Invalido:
      description: Dados inválidos
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Erro' }
  schemas:
    Erro:
      type: object
      properties:
        erro: { type: string, example: Dados inválidos }
        detalhes:
          type: array
          items: { type: string }
          example: ['email inválido']
    UsuarioEntrada:
      type: object
      required: [nome, email, idade, sexo]
      properties:
        nome: { type: string, minLength: 2, example: Maria Silva }
        email: { type: string, format: email, example: maria@email.com }
        idade: { type: integer, minimum: 12, maximum: 100, example: 25 }
        sexo: { type: string, enum: [MASCULINO, FEMININO, OUTRO], example: FEMININO }
    Usuario:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 1 }
            criadoEm: { type: string, example: '2026-11-16 19:30:00' }
        - $ref: '#/components/schemas/UsuarioEntrada'
    AvaliacaoEntrada:
      type: object
      required: [usuarioId, objetivo, nivel, diasSemana, minutosSessao, local, peso, altura, atividadeDiaria, horasSono]
      properties:
        usuarioId: { type: integer, example: 1 }
        objetivo: { type: string, enum: [EMAGRECIMENTO, HIPERTROFIA, CONDICIONAMENTO, SAUDE], example: HIPERTROFIA }
        nivel: { type: string, enum: [INICIANTE, INTERMEDIARIO, AVANCADO], example: INICIANTE }
        diasSemana: { type: integer, minimum: 2, maximum: 6, example: 4 }
        minutosSessao: { type: integer, enum: [30, 45, 60, 90], example: 60 }
        local: { type: string, enum: [CASA, ACADEMIA, AR_LIVRE], example: ACADEMIA }
        possuiEquipamento: { type: boolean, default: false, description: 'Possui halteres em casa (usado quando local = CASA)' }
        restricoes:
          type: array
          items: { type: string, enum: [JOELHO, COLUNA, OMBRO, CARDIACO] }
          example: [JOELHO]
        peso: { type: number, minimum: 30, maximum: 300, example: 70.5 }
        altura: { type: number, minimum: 1.0, maximum: 2.5, example: 1.72 }
        pesoMeta: { type: number, nullable: true, minimum: 30, maximum: 300, example: 68 }
        atividadeDiaria:
          type: string
          enum: [SEDENTARIO, LEVE, MODERADO, INTENSO]
          description: Nível de atividade fora dos treinos (usado no gasto calórico)
          example: LEVE
        horasSono: { type: integer, minimum: 3, maximum: 12, example: 7 }
    Exercicio:
      type: object
      properties:
        nome: { type: string, example: Leg press 45° }
        grupo: { type: string, enum: [PERNAS, PEITO, COSTAS, OMBROS, BRACOS, CORE, CARDIO] }
        series: { type: integer, example: 3 }
        repeticoes: { type: string, example: 8-12 }
    DiaTreino:
      type: object
      properties:
        dia: { type: string, example: Dia 1 }
        foco: { type: string, example: Membros superiores }
        exercicios:
          type: array
          items: { $ref: '#/components/schemas/Exercicio' }
    AvaliacaoAtualizacao:
      type: object
      properties:
        observacao: { type: string, maxLength: 500, example: Senti o joelho no dia 2 }
        favorita: { type: boolean, example: true }
    Avaliacao:
      allOf:
        - $ref: '#/components/schemas/AvaliacaoEntrada'
        - type: object
          properties:
            id: { type: integer, example: 1 }
            imc: { type: number, example: 23.8 }
            classificacaoImc: { type: string, example: Peso normal }
            intensidade: { type: integer, minimum: 10, maximum: 100, example: 46 }
            classificacao: { type: string, enum: [Leve, Moderada, Intensa], example: Moderada }
            perfil: { type: string, example: Construtor Muscular · Iniciante }
            tmb: { type: integer, description: Taxa metabólica basal (Mifflin-St Jeor), example: 1650 }
            metaCalorica: { type: integer, description: Meta diária de calorias, example: 2569 }
            metaProteina: { type: integer, description: Meta diária de proteínas (g), example: 141 }
            plano:
              type: array
              items: { $ref: '#/components/schemas/DiaTreino' }
            dicas:
              type: array
              items: { type: string }
            observacao: { type: string, example: '' }
            favorita: { type: boolean, example: false }
            criadoEm: { type: string, example: '2026-11-16 19:35:00' }
    Alimento:
      type: object
      properties:
        id: { type: integer, example: 1 }
        nome: { type: string, example: Arroz branco cozido }
        categoria: { type: string, example: CEREAIS }
        kcal: { type: number, description: kcal por 100 g/ml, example: 128 }
        proteina: { type: number, example: 2.5 }
        carboidrato: { type: number, example: 28.1 }
        gordura: { type: number, example: 0.2 }
        porcaoG: { type: number, description: Porção sugerida em g/ml, example: 100 }
        porcaoDescricao: { type: string, example: 4 colheres de sopa }
        personalizado: { type: boolean, description: Criado pelo usuário, example: false }
    AlimentoEntrada:
      type: object
      required: [usuarioId, nome, categoria, kcal, proteina, carboidrato, gordura, porcaoG, porcaoDescricao]
      properties:
        usuarioId: { type: integer, example: 1 }
        nome: { type: string, example: Bolo de cenoura da vó }
        categoria: { type: string, enum: [CEREAIS, PROTEINAS, LEGUMINOSAS, FRUTAS, LATICINIOS, VEGETAIS, GORDURAS, BEBIDAS, OUTROS] }
        kcal: { type: number, description: kcal por 100 g, example: 350 }
        proteina: { type: number, example: 5 }
        carboidrato: { type: number, example: 50 }
        gordura: { type: number, example: 14 }
        porcaoG: { type: number, example: 60 }
        porcaoDescricao: { type: string, example: 1 fatia }
    RegistroAlimentarEntrada:
      type: object
      required: [usuarioId, alimentoId, data, refeicao, quantidade]
      properties:
        usuarioId: { type: integer, example: 1 }
        alimentoId: { type: integer, example: 1 }
        data: { type: string, format: date, example: '2026-11-16' }
        refeicao: { type: string, enum: [CAFE_DA_MANHA, ALMOCO, LANCHE, JANTAR], example: ALMOCO }
        quantidade: { type: number, description: Gramas ou ml consumidos, example: 150 }
    RegistroAlimentar:
      allOf:
        - $ref: '#/components/schemas/RegistroAlimentarEntrada'
        - type: object
          properties:
            id: { type: integer, example: 10 }
            alimento: { type: string, example: Arroz branco cozido }
            porcaoDescricao: { type: string, example: 4 colheres de sopa }
            porcaoG: { type: number, example: 100 }
            kcal: { type: number, example: 192 }
            proteina: { type: number, example: 3.8 }
            carboidrato: { type: number, example: 42.2 }
            gordura: { type: number, example: 0.3 }
    Nutrientes:
      type: object
      properties:
        kcal: { type: number, example: 382.8 }
        proteina: { type: number, example: 42.2 }
        carboidrato: { type: number, example: 42.2 }
        gordura: { type: number, example: 3.3 }
    Diario:
      type: object
      properties:
        data: { type: string, example: '2026-11-16' }
        metaCalorica: { type: integer, example: 2200 }
        metaProteina: { type: integer, nullable: true, example: 140 }
        metaDefinidaPorAvaliacao: { type: boolean, example: true }
        totais: { $ref: '#/components/schemas/Nutrientes' }
        restante: { type: integer, description: Calorias restantes (negativo = acima da meta), example: 1817 }
        refeicoes:
          type: array
          items:
            type: object
            properties:
              refeicao: { type: string, example: ALMOCO }
              kcal: { type: number, example: 382.8 }
              itens:
                type: array
                items: { $ref: '#/components/schemas/RegistroAlimentar' }
    PesagemEntrada:
      type: object
      required: [usuarioId, peso, data]
      properties:
        usuarioId: { type: integer, example: 1 }
        peso: { type: number, example: 81.9 }
        data: { type: string, format: date, example: '2026-11-16' }
        observacao: { type: string, maxLength: 200, example: Em jejum }
    Pesagem:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 3 }
        - $ref: '#/components/schemas/PesagemEntrada'
    CadastroEntrada:
      allOf:
        - $ref: '#/components/schemas/UsuarioEntrada'
        - type: object
          required: [senha]
          properties:
            senha: { type: string, minLength: 6, maxLength: 64, example: '123456' }
    TreinoRealizadoEntrada:
      type: object
      required: [usuarioId, dia, foco, duracaoMin, data]
      properties:
        usuarioId: { type: integer, example: 1 }
        avaliacaoId: { type: integer, nullable: true, example: 2 }
        dia: { type: string, example: Dia 1 }
        foco: { type: string, example: Membros superiores }
        duracaoMin: { type: integer, minimum: 5, maximum: 300, example: 60 }
        data: { type: string, format: date, example: '2026-11-16' }
    TreinoRealizado:
      allOf:
        - type: object
          properties:
            id: { type: integer, example: 7 }
        - $ref: '#/components/schemas/TreinoRealizadoEntrada'
    Progresso:
      type: object
      properties:
        usuario: { $ref: '#/components/schemas/Usuario' }
        planoAtual:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            perfil: { type: string, example: Queimador de Calorias · Intermediário }
            objetivo: { type: string }
            classificacao: { type: string }
            diasSemana: { type: integer }
            metaCalorica: { type: integer }
            imc: { type: number }
            pesoMeta: { type: number, nullable: true }
        pesoInicial: { type: number, nullable: true, example: 74.5 }
        pesoAtual: { type: number, nullable: true, example: 71.2 }
        totalTreinos: { type: integer, example: 8 }
        minutosTotais: { type: integer, example: 480 }
        treinosSemana: { type: integer, example: 3 }
        metaSemanal: { type: integer, example: 4 }
        sequenciaDias: { type: integer, description: Dias seguidos com treino, example: 3 }
        ultimos7Dias:
          type: array
          items:
            type: object
            properties:
              data: { type: string, example: '2026-11-16' }
              treinos: { type: integer, example: 1 }
        treinosRecentes:
          type: array
          items: { $ref: '#/components/schemas/TreinoRealizado' }
